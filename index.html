<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotoba</title>
  <meta name="description" content="Personal Japanese vocabulary cards">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F3EC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kotoba">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">言葉</span>
      <span class="brand-name">Kotoba</span>
    </div>
    <button id="status" class="status status--checking" type="button" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Checking…</span>
    </button>
  </header>

  <main id="main">
    <article id="card" class="card" hidden>
      <button id="picture" class="picture" type="button" aria-label="Play pronunciation">
        <img id="word-image" alt="" draggable="false">
        <span class="speaker" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave1" d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="wave2" d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <p class="hint">Tap the picture to hear it</p>

      <div class="words">
        <p class="english" id="word-english"></p>
        <p class="japanese" id="word-japanese" lang="ja"></p>
        <p class="reading" id="word-reading" lang="ja"></p>
        <p class="romaji" id="word-romaji"></p>
        <p class="note" id="word-note" hidden></p>
      </div>
    </article>

    <p id="empty" class="empty" hidden></p>
  </main>

  <nav class="bottombar">
    <button id="prev" class="nav-btn" type="button" aria-label="Previous word">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="browse" class="browse-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>All words</span>
      <span id="counter" class="counter"></span>
    </button>
    <button id="next" class="nav-btn" type="button" aria-label="Next word">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <!-- Browse and search -->
  <section id="browser" class="sheet" hidden aria-label="All words">
    <div class="sheet-head">
      <input id="search" type="search" placeholder="Search English, Japanese or romaji" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="browser-close" class="text-btn" type="button">Done</button>
    </div>
    <ul id="word-list" class="word-list"></ul>
    <p id="no-results" class="empty" hidden>No matching words</p>
  </section>

  <!-- Offline details -->
  <section id="offline" class="sheet sheet--small" hidden aria-label="Offline status">
    <div class="sheet-head">
      <h2>Saved on this device</h2>
      <button id="offline-close" class="text-btn" type="button">Done</button>
    </div>
    <p id="offline-summary" class="offline-summary"></p>
    <ul id="file-list" class="file-list"></ul>
    <button id="recheck" class="primary-btn" type="button">Check again</button>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    // If the app's code could not load (very weak signal on the first visit), say so.
    setTimeout(function () {
      var t = document.getElementById('status-text');
      if (t && t.textContent === 'Checking…' && !window.KOTOBA_STARTED) {
        t.textContent = 'Close and reopen';
        document.getElementById('status').className = 'status status--missing';
      }
    }, 10000);
  </script>
  <script src="files.js"></script>
  <script src="app.js"></script>
</body>
</html>
